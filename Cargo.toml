[package]
name = "SystemX"
description = ""
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
license-file = "LICENSE"

[dependencies]
regex = "1.10"
# Embedding local db
sled = "0.34" 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1"
path-clean = "1"
walkdir = "2"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-printer = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.24"
pdf-extract = "0.8"
zip = "4"
quick-xml = "0.38"
calamine = "0.31"
csv = "1.3"